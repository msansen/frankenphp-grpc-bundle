name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP-CS-Fixer / Symfony coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --verbose --show-progress=dots --using-cache=no

  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '^6.4' }
          - { php: '8.2', symfony: '^7.4' }
          - { php: '8.3', symfony: '^6.4' }
          - { php: '8.3', symfony: '^7.4' }
          - { php: '8.4', symfony: '^6.4' }
          - { php: '8.4', symfony: '^7.4' }
          - { php: '8.4', symfony: '^8.1' }
          - { php: '8.5', symfony: '^7.4' }
          - { php: '8.5', symfony: '^8.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
      - name: Select Symfony version
        run: |
          composer require --no-update --no-interaction \
            'symfony/config:${{ matrix.symfony }}' \
            'symfony/dependency-injection:${{ matrix.symfony }}' \
            'symfony/http-kernel:${{ matrix.symfony }}'
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: Lint sources and tests
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit

  lowest:
    name: Lowest dependencies / PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
      - run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress
      - run: vendor/bin/phpunit
